        if(active && active !== item){
          active.classList.remove('active');
          active.querySelector('.submenu').style.display = 'none';
        }
        var submenu = item.querySelector('.submenu');
        submenu.style.display = submenu.style.display === 'block' ? 'none' : 'block';
        item.classList.toggle('active');
      }
    });
  });

  document.addEventListener('click', function(event) {
    if (!event.target.closest('.menu-item')) {
      var submenus = document.querySelectorAll('.submenu');
      submenus.forEach(function(submenu) {
        submenu.style.display = 'none';
      });
      var activeItems = document.querySelectorAll('.menu-item.active');
      activeItems.forEach(function(item) {
        item.classList.remove('active');
      });
    }
  });
});
</script>

        <input required type="text" class="text-field" placeholder="Tracking Number (USPS / UPS / FedEx) or Order #" name="tracking_number" id="Tracking-Number">

        <div id="orderNotice" class="notice"></div>

        <div class="div-block-8">

<script>
(function () {

  var form = document.getElementById('tracking_form');
  var input = document.getElementById('Tracking-Number');
  var notice = document.getElementById('orderNotice');

  function showNotice(html) {
    notice.innerHTML = html;
    notice.style.display = 'block';
  }

  function hideNotice() {
    notice.style.display = 'none';
    notice.innerHTML = '';
  }

  function fmtDate(d) {
    return new Intl.DateTimeFormat(undefined, {
      year: 'numeric',
      month: 'short',
      day: 'numeric'
    }).format(d);
  }

  function addDays(date, days) {
    var d = new Date(date);
    d.setDate(d.getDate() + days);
    return d;
  }

  function isUPS(trk) {
    return /^1Z[0-9A-Z]{16}$/i.test(trk.replace(/\s+/g, ''));
  }

  function isFedEx(trk) {
    var digits = trk.replace(/\D/g, '');
    return /^(?:\d{12}|\d{15}|\d{20}|\d{22})$/.test(digits);
  }

  function isUSPS(trk) {
    var clean = trk.replace(/\s+/g, '');
    return /^(\d{20,22}|[A-Z]{2}\d{9}[A-Z]{2})$/i.test(clean);
  }

  function isOrderNumber(val) {
    return /^#?\d{4}$/.test(val.trim());
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    hideNotice();

    var raw = input.value.trim();
    if (!raw) return;

    if (isOrderNumber(raw)) {
      var num = parseInt(raw.replace('#',''), 10);

      var today = new Date();
      var start = addDays(today, 7);
      var end = addDays(today, 14);

      if (num <= 4182) {
        showNotice(
          '<strong>Order #' + num + '</strong>' +
          'This order has already been <b>shipped and delivered</b>.' +
          '<br><br>Check your email for tracking updates.' +
          '<br><br><i><a href="https://perceptve.com/pages/contact" target="_blank">Need help with your order?</a></i>'
        );
      } else {
        showNotice(
          '<strong>Order #' + num + '</strong>' +
          'This order is currently <b>being processed and packed</b>.' +
          '<br><br>Estimated delivery: <b>' + fmtDate(start) + '</b> to <b>' + fmtDate(end) + '</b>.' +
          '<br><br>Estimates are updated every 3–4 days.' +
          '<br><br><i><a href="https://perceptve.com/pages/contact" target="_blank">Need help with your order?</a></i>'
        );
      }
      return;
    }

    var noSpaces = raw.replace(/\s+/g, '');
    var digitsOnly = raw.replace(/\D/g, '');

    if (isUPS(noSpaces)) {
      window.location.href = 'https://www.ups.com/track?tracknum=' + encodeURIComponent(noSpaces);
      return;
    }

    if (isFedEx(raw)) {
      window.location.href = 'https://www.fedex.com/fedextrack/?trknbr=' + encodeURIComponent(digitsOnly);
      return;
    }

    if (isUSPS(noSpaces)) {
      window.location.href = 'https://tools.usps.com/go/TrackConfirmAction?tLabels=' + encodeURIComponent(noSpaces);
      return;
    }

    showNotice(
      '<strong>Invalid input</strong>' +
      'Use <b>#1234</b> format for order numbers or paste a valid tracking number.'
    );

  });

  input.addEventListener('input', function () {
    if (notice.style.display === 'block') hideNotice();
  });

})();
</script>
